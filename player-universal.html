<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://discord.com https://www.mercadopago.com; upgrade-insecure-requests">
    <title>NeoTerminal Room - Player</title>
    <script>
        // GitHub Pages cannot set COOP/COEP response headers. This service worker
        // applies them in-browser and reloads only on the first compatible visit.
        window.coi = { quiet: true, coepCredentialless: () => true };
    </script>
    <script src="coi-serviceworker.js?v=3"></script>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-touch-fullscreen" content="yes">
    
    <style>
        html, body { margin: 0; background: #000; width: 100%; height: 100dvh; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        
        #game { width: 100vw; height: 100dvh; background-color: #000; }

        /* Keep the N64 core in its compatible 4:3 mode, then expand only the
           presentation on widescreen displays. The canvas parent clips the
           lateral padding without changing the emulated video mode. */
        @media (min-aspect-ratio: 4/3) {
            body.n64-widescreen #game .ejs_canvas {
                transform: scaleX(1.33334);
                transform-origin: center center;
            }
            body.n64-widescreen #game .ejs_canvas_parent { overflow: hidden; }
        }
        
        /* TELA DE LOADING */
        #loader-overlay { position: fixed; inset: 0; background: #000; z-index: 9999998; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s ease; pointer-events: none; }
        #ps1-text { color: #fff; font-family: 'Courier New', monospace; font-size: 16px; margin-bottom: 15px; text-transform: uppercase; font-weight: bold; letter-spacing: 2px; text-align: center; line-height: 1.5; }
        
        .ps1-bar-container { width: 280px; height: 15px; border: 2px solid #fff; padding: 2px; background: #000; }
        
        /* A MÁGICA VISUAL DA BARRA (Listras em movimento contínuo) */
        #ps1-bar-fill { 
            width: 0%; height: 100%; 
            background: linear-gradient(45deg, #00ff44 25%, #00cc33 25%, #00cc33 50%, #00ff44 50%, #00ff44 75%, #00cc33 75%, #00cc33 100%);
            background-size: 20px 20px;
            animation: moveStripes 1s linear infinite;
            transition: width 0.1s linear; 
        }
        
        @keyframes moveStripes {
            0% { background-position: 0 0; }
            100% { background-position: 20px 0; }
        }

        .blink { animation: blink 1.5s infinite; color: #00ff44;}
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        #neo-cloud-panel{position:fixed;left:8px;top:8px;z-index:9999999;color:#dfffe8;font:12px monospace}#neo-cloud-toggle,#neo-cloud-menu button{border:1px solid #00cc44;background:#061109;color:#55ff88;padding:8px;cursor:pointer}#neo-cloud-menu{display:none;width:210px;margin-top:5px;padding:8px;border:1px solid #00cc44;background:rgba(0,0,0,.94)}#neo-cloud-panel.open #neo-cloud-menu{display:block}.neo-cloud-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}#neo-cloud-status{padding:5px 0}.neo-cloud-login{display:block;color:#55ff88;margin:7px 0}
        #compat-error{position:fixed;inset:0;z-index:10000001;display:none;place-items:center;padding:22px;background:#020503;color:#fff;text-align:center}#compat-error.show{display:grid}#compat-error>div{max-width:520px;border:1px solid #00cc44;background:#07120b;padding:24px}#compat-error button{border:1px solid #00cc44;background:#123d20;color:#fff;padding:12px 18px;font:700 14px monospace}
    </style>
    <script src="privacy-consent-v2.js" defer></script>
</head>
<body>

    <script>
        function dispararAnuncio() { console.log("Sistema: Anúncio do Player Iniciado..."); }
    </script>

    <div id="loader-overlay">
        <div id="ps1-text">
            NOW LOADING<span id="loading-dots">...</span><br>
            <span class="blink" style="font-size: 12px;">[ AGUARDE A EXTRAÇÃO DO DISCO ]</span>
        </div>
        <div class="ps1-bar-container">
            <div id="ps1-bar-fill"></div>
        </div>
    </div>

    <div id="game"></div>
    <div id="compat-error"><div><h2>O JOGO NÃO CONSEGUIU INICIAR</h2><p id="compat-error-text">Atualize o navegador e tente novamente.</p><button type="button" onclick="window.location.reload()">TENTAR NOVAMENTE</button></div></div>

    <script src="cloud-saves.js?v=5"></script>
    <script>
        // ==========================================
        // LÓGICA DA SETA DE VOLTAR (Navegador/Celular)
        // ==========================================
        window.history.pushState({page: 1}, "", ""); // Empurra um estado falso pra fila
        window.addEventListener('popstate', function(event) {
            // Se o usuário apertar voltar, manda pro index.html
            if (new URLSearchParams(window.location.search).get('embedded') === '1' && window.top !== window) {
                window.top.location.href = '/';
            } else {
                window.location.href = "index.html";
            }
        });

        // Pega os parâmetros do jogo
        const params = new URLSearchParams(window.location.search);
        const core = params.get("core");   
        const game = params.get("game");
        const showCompatibilityError = message => {
            clearInterval(loadingInterval);
            const overlay = document.getElementById('loader-overlay');
            if (overlay) overlay.style.display = 'none';
            document.getElementById('compat-error-text').textContent = message;
            document.getElementById('compat-error').classList.add('show');
        };
        if (core === 'n64') {
            document.body.classList.add('n64-widescreen');

            // One-time repair for the incompatible 16:9 core option briefly
            // published in August 2026. EmulatorJS stores per-game options
            // ahead of defaults, so repair only that value and preserve the
            // player's controls, cheats, volume and every other preference.
            const repairKey = 'neo_n64_aspect_repair_v1';
            if (!localStorage.getItem(repairKey)) {
                for (let index = 0; index < localStorage.length; index += 1) {
                    const key = localStorage.key(index);
                    if (!key || !key.startsWith('ejs-') || !key.endsWith('-settings')) continue;
                    try {
                        const saved = JSON.parse(localStorage.getItem(key));
                        if (saved?.settings?.['mupen64plus-aspect'] === '16:9') {
                            delete saved.settings['mupen64plus-aspect'];
                            localStorage.setItem(key, JSON.stringify(saved));
                        }
                    } catch (error) {
                        console.warn('Neo N64 settings repair:', error);
                    }
                }
                localStorage.setItem(repairKey, '1');
            }

            // Repair renderer options left by older N64 builds. They are local
            // to the browser (not the account/cloud save) and can keep only a
            // specific signed-in browser on a black canvas. Preserve controls,
            // audio, cheats and every unrelated preference.
            const rendererRepairKey = 'neo_n64_renderer_repair_v2';
            if (!localStorage.getItem(rendererRepairKey)) {
                const rendererKeys = new Set(['vsync', 'shader', 'rewindEnabled', 'webgl2Enabled', 'threads']);
                for (let index = 0; index < localStorage.length; index += 1) {
                    const key = localStorage.key(index);
                    if (!key || !key.startsWith('ejs-') || !key.endsWith('-settings')) continue;
                    try {
                        const saved = JSON.parse(localStorage.getItem(key));
                        const settings = saved?.settings;
                        if (!settings || typeof settings !== 'object') continue;
                        let changed = false;
                        for (const option of Object.keys(settings)) {
                            if (rendererKeys.has(option) || option.startsWith('mupen64plus-')) {
                                delete settings[option]; changed = true;
                            }
                        }
                        if (changed) localStorage.setItem(key, JSON.stringify(saved));
                    } catch (error) { console.warn('Neo N64 renderer repair:', error); }
                }
                localStorage.setItem(rendererRepairKey, '1');
            }
        }

        // ==========================================
        // LOADING ASSINTÓTICO + PONTINHOS ANIMADOS
        // ==========================================
        let progress = 0;
        let dotCount = 0;
        let barFill = document.getElementById('ps1-bar-fill');
        let dotsEl = document.getElementById('loading-dots');
        let textEl = document.getElementById('ps1-text');
        
        let loadingInterval = setInterval(() => {
            // A barra nunca para de atualizar matematicamente
            let remaining = 99.5 - progress;
            let speed = (core === 'psx' || core === 'pcsx_rearmed') ? 0.005 : 0.05;
            progress += remaining * speed;
            if(barFill) barFill.style.width = progress + '%';
            
            // Anima os três pontinhos pra dar sensação de atividade
            dotCount = (dotCount + 1) % 4;
            if(dotsEl) dotsEl.innerText = ".".repeat(dotCount);
        }, 50); // Atualiza a cada 50ms para ser super fluido

        if (core && game) {
            const baseUrl = window.location.origin + '/';
            window.EJS_player = '#game';
            window.EJS_core = core;   
            window.EJS_backgroundColor = "#000000";

            // Preserve EmulatorJS settings and its per-device performance tuning.
            window.EJS_onGameStart = function() {
                clearInterval(loadingInterval);
                if(barFill) {
                    barFill.style.width = '100%';
                    barFill.style.animation = 'none'; // Para as listras
                }
                if(textEl) textEl.innerHTML = "<span style='color:#00ff44;'>START!</span>";
                
                dispararAnuncio(); 

                setTimeout(() => {
                    const loader = document.getElementById('loader-overlay');
                    if(loader) { loader.style.opacity = '0'; setTimeout(() => loader.style.display = 'none', 500); }
                }, 500);
            };

            window.EJS_gameUrl = game.trim().startsWith("http") ? game.trim() : baseUrl + game.trim();
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_startOnLoaded = true;
            window.EJS_language = "pt-BR";
            window.EJS_loadStateOnStart = false;    
            // Use the threaded N64 build only when the browser confirms that
            // cross-origin isolation and SharedArrayBuffer are available.
            const mobileN64 = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
                || window.matchMedia('(pointer: coarse)').matches;
            window.EJS_threads = core === 'n64'
                && window.crossOriginIsolated
                && typeof window.SharedArrayBuffer === 'function'
                && !mobileN64;
            
            // Agora o emulador só vai ter botão de Menu e Config na interface interna dele
            window.EJS_buttons = { save_state: true, load_state: true, full_screen: true, fast_forward: true, settings: true, menu: true };

            // Keep N64 close to the console's native workload. These defaults
            // avoid costly enhancements that make Zelda and other 3D games
            // stutter badly on browsers and mobile GPUs.
            window.EJS_defaultOptions = core === 'n64' ? {
                "vsync": false,
                "shader": "disabled",
                "rewindEnabled": "disabled",
                "webgl2Enabled": "enabled",
                "mupen64plus-aspect": "4:3",
                "mupen64plus-43screensize": "320x240",
                "mupen64plus-169screensize": "640x360",
                "mupen64plus-EnableNativeResFactor": "0",
                "mupen64plus-ThreadedRenderer": "True",
                "mupen64plus-MultiSampling": "0",
                "mupen64plus-FXAA": "0",
                "mupen64plus-EnableHWLighting": "False",
                "mupen64plus-EnableNativeResTexrects": "Disabled",
                "mupen64plus-txFilterMode": "None",
                "mupen64plus-txEnhancementMode": "None",
                "mupen64plus-txHiresEnable": "False",
                "mupen64plus-EnableEnhancedTextureStorage": "False",
                "mupen64plus-EnableEnhancedHighResStorage": "False",
                "mupen64plus-EnableLegacyBlending": "True",
                "mupen64plus-EnableCopyColorToRDRAM": "Async",
                "mupen64plus-Framerate": "Original"
            } : { "vsync": false };

            // ==========================================
            // FORÇANDO O CONTROLE DO PLAYSTATION
            // ==========================================
            if (core === 'psx' || core === 'pcsx_rearmed') {
                window.EJS_biosUrl = 'https://pub-44d40f83db2141efb7e8a7658c74557e.r2.dev/systems/ps1/roms/scph5501.bin';
                
                // Força nas duas variáveis conhecidas do EmulatorJS
                window.EJS_gamepadStyle = "playstation";
            }
            window.EJS_onLoadError = error => showCompatibilityError(`Falha ao carregar o emulador: ${String(error?.message || error || 'erro desconhecido')}`);
            const cacheRepairKey = 'neo_n64_emulator_cache_repair_v1';
            const emulatorCacheRepair = core !== 'n64' || localStorage.getItem(cacheRepairKey)
                ? Promise.resolve()
                : Promise.all(['EmulatorJS-core', 'EmulatorJS-roms'].map(name => new Promise(resolve => {
                    const request = indexedDB.deleteDatabase(name);
                    const finish = () => resolve();
                    request.onsuccess = finish;
                    request.onerror = finish;
                    request.onblocked = finish;
                    setTimeout(finish, 3000);
                }))).finally(() => localStorage.setItem(cacheRepairKey, '1'));
            const cloudPreparation = Promise.race([
                window.NeoCloudSaves.prepare({ game: window.EJS_gameUrl, core: window.EJS_core, name: params.get('title'), system: params.get('system') }),
                new Promise(resolve => setTimeout(resolve, 5000))
            ]);
            Promise.all([cloudPreparation.catch(error => console.warn('Neo cloud startup:', error)), emulatorCacheRepair]).finally(() => {
                const loaderScript = document.createElement('script');
                loaderScript.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
                loaderScript.onerror = () => showCompatibilityError('Não foi possível baixar o emulador. Verifique a conexão, desative bloqueadores para este site e tente novamente.');
                document.body.appendChild(loaderScript);
            });
            setTimeout(() => { if (!window.EJS_emulator) showCompatibilityError('O Safari demorou demais para iniciar o jogo. Atualize o iOS, feche outras abas e tente novamente.'); }, 45000);
        } else {
            setTimeout(() => showCompatibilityError('O endereço do jogo está incompleto. Volte ao catálogo e abra o jogo novamente.'), 0);
        }

        // Libera a instancia WebAssembly/WebGL antes de abrir outro jogo. Sem
        // isso alguns celulares restauram o N64 anterior pelo bfcache.
        addEventListener('pagehide', () => {
            clearInterval(loadingInterval);
            try { window.EJS_emulator?.gameManager?.exitGame?.(); } catch (_) {}
            try { window.EJS_emulator?.stop?.(); } catch (_) {}
        });
        addEventListener('unload', () => {});
    </script>
    <script src="multiplayer-v2.js?v=20260824-online-lobby2"></script>
</body>
</html>
