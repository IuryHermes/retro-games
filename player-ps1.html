<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://discord.com https://www.mercadopago.com; upgrade-insecure-requests">
    <script>window.location.replace(`player-universal.html${window.location.search}${window.location.hash}`);</script>
    <title>NeoTerminal Room - PS1 High Performance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="coi-serviceworker.js"></script>

    <style>
        html, body { 
            margin: 0; 
            padding: 0;
            background: #000; 
            width: 100%; 
            height: 100dvh; 
            overflow: hidden; 
        }
        #game { 
            width: 100vw; 
            height: 100dvh; 
            background-color: #000; 
        }
        #neo-cloud-panel{position:fixed;left:8px;top:8px;z-index:9999999;color:#dfffe8;font:12px monospace}#neo-cloud-toggle,#neo-cloud-menu button{border:1px solid #00cc44;background:#061109;color:#55ff88;padding:8px;cursor:pointer}#neo-cloud-menu{display:none;width:210px;margin-top:5px;padding:8px;border:1px solid #00cc44;background:rgba(0,0,0,.94)}#neo-cloud-panel.open #neo-cloud-menu{display:block}.neo-cloud-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}#neo-cloud-status{padding:5px 0}.neo-cloud-login{display:block;color:#55ff88;margin:7px 0}
    </style>
<script src="privacy-consent-v2.js" defer></script>
</head>
<body>

    <div id="game"></div>

    <script src="cloud-saves.js?v=2"></script>
    <script type="text/javascript">
        const params = new URLSearchParams(window.location.search);
        
        window.EJS_player = '#game';
        
        // CORE OTIMIZADO: pcsx_rearmed é muito mais leve que o 'psx' padrão
        window.EJS_core = 'pcsx_rearmed';  
        
        // URL do Jogo vinda do parâmetro
        window.EJS_gameUrl = params.get("game");
        
        // Caminho dos dados do EmulatorJS
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/';
        
        // Idioma (Mantido em en-US para estabilidade)
        window.EJS_language = "en-US"; 

        // BIOS REAL: Carrega o arquivo que você subiu para o R2 (scph10000 renomeado)
        window.EJS_biosUrl = 'https://pub-44d40f83db2141efb7e8a7658c74557e.r2.dev/systems/ps1/roms/scph5501.bin';

        // CONFIGURAÇÕES DE PERFORMANCE EXTREMA
        window.EJS_threads = true;        // Ativa múltiplos núcleos
        window.EJS_WS = true;             // Força WebAssembly
        window.EJS_mouse = false;         // Desativa mouse para economizar recursos
        window.EJS_multitap = false;      // Desativa multitap para ganhar velocidade
        window.EJS_startOnLoaded = true;
        window.NeoCloudSaves.prepare({ game: window.EJS_gameUrl, core: window.EJS_core, name: params.get('title'), system: params.get('system') }).finally(() => {
            const loaderScript = document.createElement('script');
            loaderScript.src = 'https://cdn.emulatorjs.org/latest/data/loader.js';
            document.body.appendChild(loaderScript);
        });
    </script>
    <script src="multiplayer-v2.js?v=20260820-referrals1"></script>
</body>
</html>
