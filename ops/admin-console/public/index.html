<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeoTerminalRoom · Administração</title><link rel="stylesheet" href="styles.css"></head><body>
<section id="login" class="login"><form id="login-form"><h1>NEOTERMINALROOM</h1><p class="muted">Painel administrativo privado</p><label>Usuário<input name="username" value="admin" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">ENTRAR</button><p id="login-error" class="error" role="alert"></p></form></section>
<section id="shell" class="shell hidden"><header class="topbar"><h1>NEO · CONTROLE 24H</h1><div><button id="refresh">ATUALIZAR</button> <button id="logout">SAIR</button></div></header><div class="layout"><nav id="nav" class="nav"></nav><main><div id="status" class="status" role="status"></div><section id="view"></section></main></div></section>
<dialog id="dialog"><form method="dialog"><button value="cancel" class="danger">FECHAR</button></form><div id="dialog-content"></div></dialog>
<script src="app.js" type="module"></script></body></html>
