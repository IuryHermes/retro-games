<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>NeoTerminalRoom — Multiplayer</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #050807;
        color: #e7ffed;
        font-family: monospace;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100dvh;
        overflow: hidden;
        min-height: 100dvh;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 12px;
        border-bottom: 1px solid #00cc44;
        background: #061109;
      }
      header strong {
        color: #55ff88;
      }
      .viewer {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
        background: #000;
      }
      .viewer video {
        width: 100%;
        height: 100%;
        max-height: none;
        object-fit: contain;
      }
      .waiting {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        width: min(88%, 480px);
        padding: 30px;
        text-align: center;
        line-height: 1.7;
        color: #9adbaa;
        background: rgba(2, 8, 4, 0.88);
        border: 1px solid #00cc44;
        border-radius: 8px;
      }
      .waiting button {
        margin-top: 12px;
        padding: 11px 15px;
        border: 1px solid #00cc44;
        background: #12331c;
        color: #fff;
        font: inherit;
      }
      .controls {
        padding: 12px 12px max(12px, env(safe-area-inset-bottom));
        background: #061109;
        border-top: 1px solid #00cc44;
      }
      .dpad,
      .actions {
        display: grid;
        gap: 8px;
      }
      .controller {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
        max-width: 720px;
        margin: auto;
      }
      .dpad {
        grid-template-columns: repeat(3, 58px);
        grid-template-rows: repeat(3, 48px);
        justify-content: center;
      }
      .actions {
        grid-template-columns: repeat(2, 64px);
        align-content: center;
        justify-content: center;
      }
      .control {
        border: 1px solid #00cc44;
        background: #102417;
        color: #fff;
        border-radius: 10px;
        font-weight: bold;
        font-size: 18px;
        touch-action: none;
        user-select: none;
      }
      .control:active,
      .control.pressed {
        background: #00cc44;
        color: #001b09;
      }
      .up {
        grid-column: 2;
      }
      .left {
        grid-column: 1;
        grid-row: 2;
      }
      .right {
        grid-column: 3;
        grid-row: 2;
      }
      .down {
        grid-column: 2;
        grid-row: 3;
      }
      .meta {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 10px;
      }
      .meta .control {
        padding: 8px 15px;
        font-size: 12px;
      }
      .desktop-input-hint {
        display: none;
        text-align: center;
        color: #9adbaa;
      }
      @media (hover: hover) and (pointer: fine) {
        .controller,
        .meta {
          display: none !important;
        }
        .desktop-input-hint {
          display: block;
        }
        .controls {
          padding: 9px;
        }
        header {
          padding: 7px 12px;
        }
      }
      @media (max-height: 500px) and (orientation: landscape) {
        body {
          grid-template-columns: 1fr 360px;
          grid-template-rows: auto 1fr;
        }
        header {
          grid-column: 1/-1;
        }
        .controls {
          border-left: 1px solid #00cc44;
          border-top: 0;
        }
        .viewer video {
          max-height: calc(100dvh - 50px);
        }
        .dpad {
          grid-template-columns: repeat(3, 48px);
          grid-template-rows: repeat(3, 40px);
        }
        .actions {
          grid-template-columns: repeat(2, 55px);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <strong id="room-title">MULTIPLAYER</strong
      ><span id="room-status">Conectando...</span>
    </header>
    <main class="viewer">
      <video id="remote-video" autoplay playsinline></video>
      <div class="waiting" id="waiting">
        Entre na sua conta no site e aguarde o anfitrião liberar um controle.
      </div>
    </main>
    <section class="controls" id="controller" hidden>
      <div class="desktop-input-hint">
        CONTROLE CONECTADO — use teclado ou gamepad USB/Bluetooth
      </div>
      <div class="controller">
        <div class="dpad">
          <button class="control up" data-index="4">▲</button
          ><button class="control left" data-index="6">◀</button
          ><button class="control right" data-index="7">▶</button
          ><button class="control down" data-index="5">▼</button>
        </div>
        <div class="actions">
          <button class="control" data-index="1">Y</button
          ><button class="control" data-index="9">X</button
          ><button class="control" data-index="0">B</button
          ><button class="control" data-index="8">A</button>
        </div>
      </div>
      <div class="meta">
        <button class="control" data-index="10">L</button
        ><button class="control" data-index="2">SELECT</button
        ><button class="control" data-index="3">START</button
        ><button class="control" data-index="11">R</button>
      </div>
    </section>
    <script>
      (() => {
        "use strict";
        const API =
          "https://webhook-pix-cafe.neoterminalroom-oficial.workers.dev";
        const roomId = new URLSearchParams(location.search).get("room") || "";
        const access =
          sessionStorage.getItem("neo_club_access") ||
          sessionStorage.getItem("neo_account_access") ||
          "";
        let socket,
          clientId = "",
          channel,
          peer,
          seat = 0,
          iceServersPromise,
          videoReady = false,
          iceServersExpiresAt = 0;
        const iceServers = () =>
          iceServersPromise && Date.now() < iceServersExpiresAt
            ? iceServersPromise
            : ((iceServersExpiresAt = Date.now() + 3.5 * 60 * 60 * 1000),
              (iceServersPromise = fetch(`${API}/multiplayer/ice-servers`, {
                headers: { Authorization: `Bearer ${access}` },
              })
                .then((response) =>
                  response.ok ? response.json() : Promise.reject(),
                )
                .then((data) => data.iceServers)
                .catch(() => [{ urls: ["stun:stun.cloudflare.com:3478"] }])));
        const pendingCandidates = [];
        const status = document.getElementById("room-status"),
          waiting = document.getElementById("waiting"),
          controller = document.getElementById("controller"),
          video = document.getElementById("remote-video");
        const send = (data) => {
          if (socket?.readyState === 1) socket.send(JSON.stringify(data));
        };
        let playbackUnlocked = false;
        async function unlockPlayback() {
          if (playbackUnlocked || !video.srcObject) return;
          if (
            document.fullscreenEnabled &&
            !document.fullscreenElement &&
            matchMedia("(max-width: 900px)").matches
          )
            void document.documentElement.requestFullscreen().catch(() => {});
          video.muted = false;
          try {
            await video.play();
            playbackUnlocked = true;
          } catch (_) {
            video.muted = true;
            await video.play().catch(() => {});
          }
        }
        const input = (index, value) => {
          void unlockPlayback();
          const data = { type: "input", index: Number(index), value };
          if (channel?.readyState === "open")
            channel.send(JSON.stringify(data));
          else send(data);
        };
        addEventListener("pointerdown", unlockPlayback, { passive: true });
        addEventListener("keydown", unlockPlayback);
        const keyboardMap = {
          ArrowUp: 4,
          ArrowDown: 5,
          ArrowLeft: 6,
          ArrowRight: 7,
          z: 0,
          x: 8,
          a: 1,
          s: 9,
          Enter: 3,
          Shift: 2,
          q: 10,
          e: 11,
        };
        const pressedKeys = new Set();
        const keyboardInput = (event) => {
          const key =
            event.key.length === 1 ? event.key.toLowerCase() : event.key;
          const index = keyboardMap[key];
          if (index === undefined || !seat) return;
          event.preventDefault();
          if (event.type === "keydown") {
            if (pressedKeys.has(key)) return;
            pressedKeys.add(key);
            input(index, 1);
          } else {
            pressedKeys.delete(key);
            input(index, 0);
          }
        };
        addEventListener("keydown", keyboardInput);
        addEventListener("keyup", keyboardInput);
        const gamepadState = new Map();
        const gamepadButtons = {
          0: 0,
          1: 8,
          2: 1,
          3: 9,
          4: 10,
          5: 11,
          8: 2,
          9: 3,
          12: 4,
          13: 5,
          14: 6,
          15: 7,
        };
        const pollGamepad = () => {
          const gamepad = Array.from(navigator.getGamepads?.() || []).find(
            Boolean,
          );
          if (gamepad && seat)
            for (const [button, index] of Object.entries(gamepadButtons)) {
              const value = gamepad.buttons[Number(button)]?.pressed ? 1 : 0;
              if (gamepadState.get(index) !== value) {
                gamepadState.set(index, value);
                input(index, value);
              }
            }
          requestAnimationFrame(pollGamepad);
        };
        requestAnimationFrame(pollGamepad);
        document.querySelectorAll(".control").forEach((button) => {
          const down = (e) => {
            e.preventDefault();
            if (button.classList.contains("pressed")) return;
            button.classList.add("pressed");
            input(button.dataset.index, 1);
          };
          const up = (e) => {
            e.preventDefault();
            button.classList.remove("pressed");
            input(button.dataset.index, 0);
          };
          button.addEventListener("pointerdown", down);
          button.addEventListener("pointerup", up);
          button.addEventListener("pointercancel", up);
          button.addEventListener("pointerleave", up);
        });
        async function signal(message) {
          if (!peer) {
            const configuration = await iceServers();
            if (!peer)
              peer = new RTCPeerConnection({ iceServers: configuration });
          }
          if (!peer.onicecandidate) {
            const currentPeer = peer;
            currentPeer.onicecandidate = (e) => {
              if (e.candidate)
                send({
                  type: "signal",
                  to: message.from,
                  data: { candidate: e.candidate },
                });
            };
            currentPeer.ontrack = async (e) => {
              video.srcObject = e.streams[0];
              videoReady = true;
              waiting.hidden = true;
              video.muted = false;
              try {
                await video.play();
                playbackUnlocked = true;
              } catch (_) {
                video.muted = true;
                await video.play().catch(() => {});
              }
            };
            currentPeer.onconnectionstatechange = () => {
              const labels = {
                connecting: "Conectando vídeo...",
                connected: "Vídeo conectado",
                disconnected: "Reconectando vídeo...",
                failed:
                  "Falha no vídeo. Peça ao anfitrião para reabrir a sala.",
              };
              if (labels[currentPeer.connectionState])
                status.textContent = labels[currentPeer.connectionState];
            };
            currentPeer.ondatachannel = (e) => {
              channel = e.channel;
            };
          }
          if (message.data?.description) {
            await peer.setRemoteDescription(message.data.description);
            for (const candidate of pendingCandidates.splice(0))
              await peer.addIceCandidate(candidate).catch(() => {});
            const answer = await peer.createAnswer();
            await peer.setLocalDescription(answer);
            send({
              type: "signal",
              to: message.from,
              data: { description: peer.localDescription },
            });
          }
          if (message.data?.candidate) {
            if (peer.remoteDescription)
              await peer
                .addIceCandidate(message.data.candidate)
                .catch(() => {});
            else pendingCandidates.push(message.data.candidate);
          }
        }
        async function join() {
          if (!access) {
            sessionStorage.setItem("neo_pending_multiplayer_room", roomId);
            status.textContent = "Login necessário";
            waiting.innerHTML =
              'Entre pela <a href="index.html" style="color:#55ff88">página inicial</a>. Após o login, você voltará automaticamente para esta sala.';
            return;
          }
          try {
            const response = await fetch(
              `${API}/multiplayer/rooms/${encodeURIComponent(roomId)}/join`,
              {
                method: "POST",
                headers: { Authorization: `Bearer ${access}` },
              },
            );
            const data = await response.json();
            if (!response.ok)
              throw new Error(data.erro || "Sala indisponível.");
            document.getElementById("room-title").textContent = data.room.title;
            socket = new WebSocket(
              `${API.replace("https:", "wss:")}/multiplayer/rooms/${roomId}/ws?ticket=${encodeURIComponent(data.ticket)}`,
            );
            socket.onmessage = (e) => {
              const message = JSON.parse(e.data);
              if (message.type === "welcome") clientId = message.clientId;
              if (message.type === "state")
                status.textContent = `${message.participants.length}/${message.room.maxPlayers} online`;
              if (message.type === "assignment") {
                seat = message.seat;
                controller.hidden = !message.approved;
                if (!videoReady) {
                  waiting.hidden = false;
                  waiting.textContent = message.approved
                    ? `Você é o controle ${seat}. Aguardando vídeo...`
                    : "Aguardando aprovação do anfitrião.";
                }
              }
              if (message.type === "signal") void signal(message);
            };
            socket.onclose = (e) => {
              status.textContent =
                e.code === 4003 ? "Removido pelo anfitrião" : "Sala encerrada";
              controller.hidden = true;
            };
          } catch (error) {
            status.textContent = "Não conectado";
            waiting.textContent = error.message;
          }
        }
        join();
      })();
    </script>
  </body>
</html>
