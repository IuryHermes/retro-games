<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Saves online | NeoTerminalRoom</title>
  <meta http-equiv="refresh" content="0;url=index.html#saves">
  <style>
    :root{color-scheme:dark;--green:#42ff85;--panel:#07120b;--line:#174a29}*{box-sizing:border-box}body{margin:0;background:#010302;color:#dcffe7;font-family:Segoe UI,Arial,sans-serif}main{max-width:1050px;margin:auto;padding:36px 20px}h1{color:var(--green);font-family:Consolas,monospace}.note{color:#8cb798}.login,.play{display:inline-block;border:1px solid var(--green);background:#0b2815;color:var(--green);padding:12px 18px;text-decoration:none;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:28px}.card{border:1px solid var(--line);background:var(--panel);padding:16px}.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#000}.card h2{font-size:17px;min-height:42px}.hidden{display:none}a.back{color:#8cb798}
  </style>
<script src="privacy-consent.js" defer></script>
</head>
<body><main style="display:none">
  <a class="back" href="index.html">← Voltar ao site</a>
  <h1>CONTEÚDO ANTECIPADO</h1>
  <p class="note">Três jogos de PS1 com disco único são selecionados por semana. Acesso exclusivo para Cartucho e Arcade.</p>
  <section id="login"><p>Conecte seu Discord para confirmar o cargo ativo.</p><a class="login" href="https://webhook-pix-cafe.neoterminalroom-oficial.workers.dev/club/login">ENTRAR COM DISCORD</a></section>
  <p id="status"></p><section id="games" class="grid"></section>
</main><script>
const worker='https://webhook-pix-cafe.neoterminalroom-oficial.workers.dev';
const fragment=new URLSearchParams(location.hash.slice(1)); if(fragment.get('token')){sessionStorage.setItem('neo_club_access',fragment.get('token'));history.replaceState(null,'',location.pathname)}
const token=sessionStorage.getItem('neo_club_access'); const status=document.getElementById('status'); const games=document.getElementById('games');
if(new URLSearchParams(location.search).get('erro')==='plano') status.textContent='Este acesso exige um cargo Cartucho ou Arcade ativo.';
if(token){document.getElementById('login').classList.add('hidden');status.textContent='Validando acesso...';fetch(`${worker}/club/week?token=${encodeURIComponent(token)}`).then(async r=>{if(!r.ok)throw new Error('Acesso expirado. Entre novamente com o Discord.');return r.json()}).then(data=>{status.textContent='Seleção desta semana:';data.games.forEach(game=>{const card=document.createElement('article');card.className='card';const media=game.preview||game.capa;const image=media?(media.includes('/')?`https://pub-44d40f83db2141efb7e8a7658c74557e.r2.dev/systems/ps1/${media}`:`https://pub-44d40f83db2141efb7e8a7658c74557e.r2.dev/systems/ps1/previews/${media}`):'';card.innerHTML=`${image?`<img src="${image}" alt="">`:''}<h2></h2><a class="play">JOGAR AGORA</a>`;card.querySelector('h2').textContent=game.nome;card.querySelector('.play').href=`player-ps1.html?game=${encodeURIComponent(game.play)}`;games.appendChild(card)})}).catch(error=>{sessionStorage.removeItem('neo_club_access');status.textContent=error.message;document.getElementById('login').classList.remove('hidden')})}
</script></body></html>
